<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>Jardín Eterno - Edición Final</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; touch-action: none; }
  body {
    background: #0e0a18;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    width: 100vw;
    overflow: hidden;
    font-family: 'Georgia', serif;
  }
  canvas {
    display: block;
    max-width: 100%;
    max-height: 100%;
    filter: drop-shadow(0 0 10px rgba(120, 150, 255, 0.1));
  }
  #dedicatoria {
    position: absolute;
    top: 40px;
    left: 50%;
    transform: translateX(-50%);
    width: 85%;
    max-width: 700px;
    text-align: center;
    color: #f7c9cf;
    font-size: clamp(1rem, 4vw, 1.2rem);
    line-height: 1.6;
    z-index: 10;
    text-shadow: 0 0 8px rgba(247, 201, 207, 0.4);
    font-style: italic;
  }
</style>
</head>
<body>
<div id="dedicatoria"></div>

<!-- Botón de sonido discreto -->
<!-- AUDIO LOCAL -->
<audio id="rain-audio" loop>
  <source src="lluvia-suave.mp3" type="audio/mpeg">
</audio>

<!-- Botón de sonido -->
<div id="sound-btn" style="
  position: absolute;
  bottom: 22px;
  right: 22px;
  z-index: 20;
  width: 38px;
  height: 38px;
  border-radius: 50%;
  background: rgba(247, 201, 207, 0.12);
  border: 1px solid rgba(247, 201, 207, 0.3);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: background 0.3s;
" title="Activar sonido">
</div>

<canvas id="c"></canvas>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

<!-- 🔊 NUEVO SISTEMA DE AUDIO -->
<script>
(function(){
  const btn = document.getElementById('sound-btn');
  const audio = document.getElementById('rain-audio');
  let isPlaying = false;

  audio.loop = true;
  audio.volume = 0;
  

  const svgOn = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#f7c9cf" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
    <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
    <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
  </svg>`;

  const svgOff = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#f7c9cf" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
    <line x1="23" y1="9" x2="17" y2="15"/>
    <line x1="17" y1="9" x2="23" y2="15"/>
  </svg>`;

  btn.innerHTML = svgOff;

  function fadeInAudio() {
    audio.play();
    let v = 0;
    const fade = setInterval(() => {
      v += 0.01;
      audio.volume = Math.min(v, 0.35);
      if (v >= 0.35) clearInterval(fade);
    }, 50);
  }

  function fadeOutAudio() {
    let v = audio.volume;
    const fade = setInterval(() => {
      v -= 0.01;
      audio.volume = Math.max(v, 0);
      if (v <= 0) {
        clearInterval(fade);
        audio.pause();
        audio.currentTime = 0;
      }
    }, 50);
  }

  btn.addEventListener('click', () => {
    if (!isPlaying) {
      fadeInAudio();
      btn.innerHTML = svgOn;
      btn.style.background = 'rgba(247, 201, 207, 0.22)';
      btn.title = 'Silenciar';
      isPlaying = true;
    } else {
      fadeOutAudio();
      btn.innerHTML = svgOff;
      btn.style.background = 'rgba(247, 201, 207, 0.08)';
      btn.title = 'Activar sonido';
      isPlaying = false;
    }
  });
})();
</script>

<script>
(function(){
  const cv = document.getElementById('c');
  const ctx = cv.getContext('2d');
  let W, H, BY, scale;
  let FLOWERS = [];
  const S = { sparkle: 0, fog: 0, wind: 0 };

  function resize() {
    W = window.innerWidth; H = window.innerHeight;
    const dpr = window.devicePixelRatio || 1;
    cv.width = W * dpr; cv.height = H * dpr;
    cv.style.width = W + 'px'; cv.style.height = H + 'px';
    ctx.scale(dpr, dpr);
    BY = H * 0.85;
    scale = Math.min(W / 1100, H / 850, 0.9);
    initGarden();
  }

  function initGarden() {
    FLOWERS = [];
    const groupWidth = 400 * scale; 
    const totalGroups = Math.ceil(W / groupWidth) + 1;
    const startX = (W - (totalGroups - 1) * groupWidth) / 2;

    for (let i = 0; i < totalGroups; i++) {
      let basePos = startX + i * groupWidth;
      const pattern = [
        { type: 'tulip', x: basePos - 120 * scale, h: 290, c1:'#d97a86', c2:'#eaa1aa', c3:'#f6c1c7', delay: i*0.4, side:1 },
        { type: 'tulip', x: basePos - 50 * scale, h: 340, c1:'#d66a8a', c2:'#e89ab0', c3:'#f4c2d0', delay: i*0.4 + 0.2, side:1 },
        { type: 'lily', x: basePos + 80 * scale, delay: i*0.4 + 0.5 }
      ];

      pattern.forEach((f, j) => {
        const id = `${f.type}_${i}_${j}`;
        if (f.type === 'tulip') {
          S[id] = { s: 0, l: 0, b: 0, c: 0 };
          FLOWERS.push({ ...f, id });
          gsap.to(S[id], { s: 1, duration: 3, delay: f.delay });
          gsap.to(S[id], { l: 1, duration: 2, delay: f.delay + 1 });
          gsap.to(S[id], { b: 1, duration: 2.5, delay: f.delay + 1.5 });
          gsap.to(S[id], { c: 1, duration: 2.5, delay: f.delay + 2 });
        } else {
          S[id] = { grow: 0, open: 0 };
          FLOWERS.push({ ...f, id });
          gsap.to(S[id], { grow: 1, duration: 5, delay: f.delay });
          gsap.to(S[id], { open: 1, duration: 4, delay: f.delay + 2 });
        }
      });
    }
    gsap.to(S, { sparkle: 1, duration: 6, delay: 1 });
    gsap.to(S, { fog: 1, duration: 5, delay: 2 });
  }

  window.addEventListener('resize', resize);
  resize();

  // --- MÁQUINA DE ESCRIBIR ---
  const mensaje = "Esta es una cordial invitación para una tarde de películas y churritos en tu casa 😉 De: Víctor, Para: La cebollita más bonita 🌸. Quedo al pendiente de su respuesta...";
  let charIdx = 0;
  function typeWriter() {
    if (charIdx < mensaje.length) {
      document.getElementById('dedicatoria').innerHTML += mensaje.charAt(charIdx);
      charIdx++;
      setTimeout(typeWriter, 70);
    }
  }
  setTimeout(typeWriter, 1500);

  // --- LUNA ELIMINADA ---
  function drawMoon() {}

  // --- HOJA DE NENÚFAR (estilo código 2: con scale integrado) ---
  function drawLilyPad(x, y, p) {
    if (p <= 0) return;
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(p, p);
    ctx.beginPath();
    ctx.ellipse(0, 0, 140, 45, 0, 0, Math.PI * 1.85);
    ctx.lineTo(0, 0); ctx.closePath();
    const g = ctx.createRadialGradient(0, 0, 20, 0, 0, 140);
    g.addColorStop(0, "#2a6336"); g.addColorStop(1, "#153d1a");
    ctx.fillStyle = g; ctx.fill();
    ctx.restore();
  }

  // --- LIRIO ESTRELLA (estilo código 2: pétalos con drawPetal interno) ---
  function drawStarLily(x, y, p, open, wind) {
    if (p <= 0) return;
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(p, p);
    if(open > 0.1) {
      const glow = ctx.createRadialGradient(0, -20, 0, 0, -20, 120 * open);
      glow.addColorStop(0, `rgba(255, 220, 240, ${0.25 * open})`);
      glow.addColorStop(1, "transparent");
      ctx.fillStyle = glow; ctx.beginPath(); ctx.arc(0, -20, 120 * open, 0, Math.PI * 2); ctx.fill();
    }
    const palette = [['#c85f7a', '#eaa1aa'], ['#d97a86', '#f2b6c1'], ['#eaa1aa', '#f6cbd3'], ['#f6cbd3', '#fff0f3']];
    const drawPetal = (angle, len, width, c1, c2, lift) => {
      ctx.save(); ctx.rotate(angle); ctx.translate(0, lift);
      const g = ctx.createLinearGradient(0, 0, 0, -len);
      g.addColorStop(0, c1); g.addColorStop(0.8, c2);
      g.addColorStop(1, "rgba(255, 255, 255, 0.05)");
      ctx.beginPath(); ctx.moveTo(0, 0);
      ctx.quadraticCurveTo(-width, -len * 0.5, 0, -len);
      ctx.quadraticCurveTo(width, -len * 0.5, 0, 0);
      ctx.fillStyle = g; ctx.fill(); ctx.restore();
    };
    [90, 75, 60, 45].forEach((len, i) => {
      let count = 7 - i;
      for (let j = 0; j < count; j++) {
        let t = j / (count - 1);
        let angle = (-Math.PI / 2 + t * Math.PI) * (0.9 - i * 0.2);
        drawPetal(angle * open, len, 24 - i * 4, palette[i][0], palette[i][1], -10 + i * 5);
      }
    });
    ctx.restore();
  }

  // --- HOJA DE TULIPÁN (estilo código 2: con ángulo basado en stemCx) ---
  function drawLeaf(x, y, p, side, windW, stemCx) {
    if (p <= 0) return;
    ctx.save(); 
    ctx.translate(x, y);
    ctx.scale(side * p * scale + windW * 0.005, p * scale);
    const angle = (stemCx - (x - stemCx)) * 0.0001;
    ctx.rotate(angle);
    ctx.beginPath(); ctx.moveTo(0, 0);
    ctx.bezierCurveTo(40, -15, 60, -80, 15, -120);
    ctx.bezierCurveTo(10, -80, -10, -50, 0, 0);
    const g = ctx.createRadialGradient(0, -60, 10, 0, -60, 120);
    g.addColorStop(0, "#2a6336"); g.addColorStop(1, "#153d1a");
    ctx.fillStyle = g; ctx.fill(); 
    ctx.restore();
  }

  // --- TULIPÁN (estilo código 2: scale directo sin * scale interno) ---
  function drawTulip(x, y, b, c, c1, c2, c3, wind) {
    if (b <= 0) return;
    ctx.save(); ctx.translate(x, y); ctx.scale(b, b); ctx.rotate(wind * 0.02);
    const petal = (rot, sx, col) => {
      ctx.save(); ctx.rotate(rot * c); ctx.scale(sx, 1);
      const g = ctx.createLinearGradient(0, 0, 0, -70);
      g.addColorStop(0, col);
      g.addColorStop(0.85, col);
      g.addColorStop(1, "rgba(255, 255, 255, 0.08)");
      ctx.beginPath(); ctx.moveTo(0, 0);
      ctx.bezierCurveTo(-25, -10, -30, -60, 0, -70);
      ctx.bezierCurveTo(30, -60, 25, -10, 0, 0);
      ctx.fillStyle = g; ctx.fill(); ctx.restore();
    };
    petal(-0.3, 0.9, c1); petal(0.3, 0.9, c1); petal(0, 1.1, c2);
    petal(-0.15 * c, 1, c3); petal(0.15 * c, 1, c3);
    ctx.restore();
  }

  // --- ESTRELLAS DE FONDO ---
  const STARS = Array.from({ length: 80 }, () => ({
    x: Math.random(), y: Math.random() * 0.75,
    r: Math.random() * 1.2 + 0.2,
    phase: Math.random() * Math.PI * 2,
    speed: 0.003 + Math.random() * 0.005
  }));

  function drawStars() {
    ctx.save();
    STARS.forEach(s => {
      const alpha = 0.3 + 0.4 * Math.sin(frame * s.speed + s.phase);
      ctx.globalAlpha = alpha;
      ctx.beginPath();
      ctx.arc(s.x * W, s.y * H, s.r * scale, 0, Math.PI * 2);
      ctx.fillStyle = "#fff";
      ctx.fill();
    });
    ctx.restore();
  }

  // --- SPARKLES más lentas ---
  const SPARKS = Array.from({ length: 45 }, () => ({
    xRel: Math.random(), yRel: Math.random(),
    size: Math.random() * 2 + 0.3,
    speed: 0.08 + Math.random() * 0.15,  // mucho más lentas
    seed: Math.random() * 10
  }));

  function drawParticles(p) {
    ctx.save();
    SPARKS.forEach(s => {
      s.yRel -= (s.speed * 0.0005);  // velocidad reducida
      if (s.yRel < 0) s.yRel = 0.85;
      let x = s.xRel * W + Math.sin(frame * 0.008 + s.seed) * 10;  // drift suave
      let y = s.yRel * H;
      ctx.globalAlpha = p * 0.45;
      ctx.beginPath(); ctx.arc(x, y, s.size * scale, 0, Math.PI * 2);
      ctx.fillStyle = "#fff"; ctx.fill();
    });
    ctx.restore();
  }

  // --- VAPOR SUTIL (sube desde el agua, no tapa flores) ---
  const WISPS = Array.from({ length: 18 }, () => ({
    x: Math.random(),
    y: 1.0,
    size: 18 + Math.random() * 25,
    speed: 0.00012 + Math.random() * 0.00010,
    drift: (Math.random() - 0.5) * 0.0003,
    alpha: 0.018 + Math.random() * 0.022,
    phase: Math.random() * Math.PI * 2
  }));

  function drawFog() {
    ctx.save();
    WISPS.forEach(w => {
      // sube lentamente
      w.y -= w.speed;
      w.x += w.drift;
      // se desvanece cuanto más sube (solo visible cerca del agua)
      const distFromWater = (1.0 - w.y); // 0 en el agua, mayor arriba
      if (distFromWater > 0.18 || w.y < 0) {
        // reinicia desde el agua en posición aleatoria
        w.y = 1.0;
        w.x = Math.random();
        w.size = 18 + Math.random() * 25;
      }
      // opacidad: máxima justo en la base, se desvanece al subir
      const fade = Math.max(0, 1 - distFromWater / 0.18);
      const wobble = Math.sin(frame * 0.006 + w.phase) * 8;
      const px = w.x * W + wobble;
      const py = w.y * H;
      const g = ctx.createRadialGradient(px, py, 0, px, py, w.size);
      g.addColorStop(0, `rgba(140, 200, 180, ${w.alpha * fade * S.fog})`);
      g.addColorStop(1, `rgba(140, 200, 180, 0)`);
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(px, py, w.size, 0, Math.PI * 2);
      ctx.fill();
    });
    ctx.restore();
  }

  let frame = 0;
  function render() {
    ctx.fillStyle = '#0e0a18'; ctx.fillRect(0, 0, W, H);
    frame++;

    // Viento más lento para tulipanes y lirios
    const w = Math.sin(frame * 0.008) * 6;  // antes 0.02 * 8

    drawStars();
    drawMoon();
    drawParticles(S.sparkle * 0.25);

    // Agua / fondo inferior
    const wg = ctx.createLinearGradient(0, BY, 0, H);
    wg.addColorStop(0, "#0b1a2a"); wg.addColorStop(1, "#020611");
    ctx.fillStyle = wg; ctx.fillRect(0, BY, W, H - BY);

    FLOWERS.forEach(f => {
      const st = S[f.id];
      if (f.type === 'lily') {
        // Reflejo animado en el agua
        ctx.save();
        ctx.translate(f.x, BY + 30 * scale);
        ctx.scale(scale, -0.4 * scale);
        ctx.globalAlpha = 0.15;
        // ondulación más visible en el reflejo
        ctx.transform(1, 0.14 * Math.sin(frame * 0.018 + f.x * 0.01), 0, 1, 0, 0);
        drawLilyPad(0, 0, st.grow);
        drawStarLily(0, -10, st.grow, st.open, 0);
        ctx.restore();

        // Lirio real con balanceo suave
        const lilySwing = Math.sin(frame * 0.01 + f.x * 0.005) * 3 * scale;
        ctx.save();
        ctx.translate(f.x + lilySwing, 0);
        drawLilyPad(0, BY + 10 * scale, st.grow * scale);
        drawStarLily(0, BY + 5 * scale, st.grow * scale, st.open, lilySwing);
        ctx.restore();
      } else {
        // Tallo con curvatura por viento más lento
        const tipX = f.x + w * 2;
        const tipY = BY - (f.h * scale * 1.05) * st.s;
        const stemCx = f.x + w;
        const stemCy = BY - (f.h * scale * 0.5) * st.s;

        ctx.beginPath(); ctx.moveTo(f.x, BY);
        ctx.quadraticCurveTo(stemCx, stemCy, tipX, tipY);
        ctx.strokeStyle = '#2d5a27'; ctx.lineWidth = 5 * scale; ctx.stroke();

        if (st.s > 0.1) {
          drawLeaf(f.x + w, BY - f.h * scale * 0.28 * st.s, st.l, f.side, w, stemCx);
          drawLeaf(f.x + w * 1.2, BY - f.h * scale * 0.52 * st.s, st.l, -f.side, w, stemCx);
          drawTulip(tipX, tipY, st.b * scale, st.c, f.c1, f.c2, f.c3, w);
        }
      }
    });

    drawFog();
    drawParticles(S.sparkle);
    requestAnimationFrame(render);
  }
  render();
})();
</script>
</body>
</html>
